name: Deploy RaceControl static files to OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: "Preflight only, or deploy after review"
        type: choice
        options:
          - preflight
          - deploy
        default: preflight
        required: true

permissions:
  contents: read

concurrency:
  group: racecontrol-ovh-additive-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and additively upload Live Timing only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OVH_HOST: ${{ secrets.OVH_HOST }}
      OVH_PORT: ${{ secrets.OVH_PORT }}
      OVH_USERNAME: ${{ secrets.OVH_USERNAME }}
      OVH_PASSWORD: ${{ secrets.OVH_PASSWORD }}
      OVH_TARGET_DIR: ${{ secrets.OVH_TARGET_DIR }}
      OVH_SSH_HOST_KEY_SHA256: ${{ secrets.OVH_SSH_HOST_KEY_SHA256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            legacy/live-timing-49349/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Install validated 49349 app dependencies
        run: npm ci
        working-directory: legacy/live-timing-49349

      - name: Build validated 49349 public Live Timing export
        run: npm run build
        working-directory: legacy/live-timing-49349
        env:
          NEXT_PUBLIC_LIVE_TIMING_API_URL: https://api.b404ldc.fr

      - name: Verify validated 49349 Live Timing export
        run: python -m unittest discover -s tests -p 'test_live_timing_49349_public_export.py' -v

      - name: Verify static export and targeted UI regression
        shell: bash
        run: |
          set -euo pipefail
          test -d out
          test -f out/index.html
          test "$(find out -type f | wc -l)" -gt 0
          node --test tests/contact-modal-performance.test.mjs tests/live-timing-table-model.test.mjs tests/public-live-timing-api-url.test.mjs tests/public-live-timing-contract.test.mjs

      - name: Set up Python for safe SFTP upload
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko>=3.5,<5'

      - name: Test additive uploader
        run: python -m unittest discover -s tests -p 'test_ovh_additive_deploy.py' -v

      - name: Check required OVH secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in OVH_HOST OVH_PORT OVH_USERNAME OVH_PASSWORD OVH_TARGET_DIR OVH_SSH_HOST_KEY_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "No connection or remote file operation was attempted. Add the missing repository secrets, then rerun the workflow."
            exit 1
          fi

      - name: Read-only SFTP preflight (no remote writes)
        run: python scripts/deploy_ovh_additive.py --live-timing-only --source-root legacy/live-timing-49349/out --preflight-only

      - name: Upload static files to OVH (additive only)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ovh-deploy]')) }}
        run: python scripts/deploy_ovh_additive.py --live-timing-only --source-root legacy/live-timing-49349/out
